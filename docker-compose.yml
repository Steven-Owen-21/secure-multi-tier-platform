version: "3.8"

services:
  # PostgreSQL 15 - Database tier
  postgres:
    image: postgres:15
    container_name: platform-postgres
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 - Cache tier
  redis:
    image: redis:7
    container_name: platform-redis
    command: redis-server --requirepass redis_local_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_local_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack - AWS service emulation
  localstack:
    image: localstack/localstack:latest
    container_name: platform-localstack
    environment:
      - SERVICES=cognito-idp,apigateway,s3,dynamodb,sns,secretsmanager,route53,logs,cloudfront,kms,iam,backup,servicequotas
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=eu-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4566:4566"        # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Service (for local development)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: platform-app
    environment:
      - DATABASE_URL=postgresql+asyncpg://platform_user:platform_local_password@postgres:5432/platform_db
      - REDIS_URL=redis://:redis_local_password@redis:6379/0
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=eu-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - COGNITO_USER_POOL_ID=local_user_pool
      - COGNITO_CLIENT_ID=local_client_id
      - COGNITO_REGION=eu-west-2
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    profiles:
      - full  # Only start with --profile full; for dev, run uvicorn directly

volumes:
  postgres_data:
  redis_data:
  localstack_data:

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  statuses: write

env:
  PYTHON_VERSION: "3.11"
  HYPOTHESIS_MAX_EXAMPLES: "200"
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: secure-multi-tier-platform

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 1: Lint - black, ruff, mypy
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (black, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check --diff app/ tests/

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type check with mypy
        run: mypy app/

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 2: Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short -m unit --junitxml=reports/unit-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/unit-results.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 3: Property-Based Tests (Hypothesis with 200 examples in CI)
  # ─────────────────────────────────────────────────────────────────────────────
  property-test:
    name: Property-Based Tests (Hypothesis)
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run property-based tests
        env:
          HYPOTHESIS_MAX_EXAMPLES: ${{ env.HYPOTHESIS_MAX_EXAMPLES }}
        run: |
          pytest tests/properties -v --tb=short -m property \
            --hypothesis-seed=0 \
            --junitxml=reports/property-results.xml \
            -p no:hypothesis-explain

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-test-results
          path: reports/property-results.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 4: Security Scan - Checkov/tfsec against Terraform
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Checkov/tfsec)
    runs-on: ubuntu-latest
    needs: [property-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform code
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/
          framework: terraform
          check: HIGH,CRITICAL
          soft_fail: false
          output_format: cli
          output_file_path: reports/

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/
          soft_fail: false
          additional_args: --minimum-severity HIGH

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 5: Build - Docker image build and push to ECR
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PIPELINE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ecr-login.outputs.registry && format('{0}/{1}:{2}', steps.ecr-login.outputs.registry, env.ECR_REPOSITORY, steps.meta.outputs.sha_short) || format('{0}:latest', env.ECR_REPOSITORY) }}
            ${{ steps.ecr-login.outputs.registry && format('{0}/{1}:latest', steps.ecr-login.outputs.registry, env.ECR_REPOSITORY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 6: Integration Tests - LocalStack + Docker Compose
  # ─────────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests (LocalStack)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: platform_db
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_user -d platform_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:latest
        env:
          SERVICES: cognito-idp,apigateway,s3,dynamodb,sns,secretsmanager,route53,logs,cloudfront,kms,iam,backup,servicequotas
          DEBUG: "0"
          AWS_DEFAULT_REGION: eu-west-2
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for LocalStack..."
          timeout 60 bash -c 'until curl -sf http://localhost:4566/_localstack/health; do sleep 2; done'
          echo "Waiting for PostgreSQL..."
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U platform_user; do sleep 2; done'
          echo "All services ready."

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://platform_user:platform_local_password@localhost:5432/platform_db
        run: alembic upgrade head

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://platform_user:platform_local_password@localhost:5432/platform_db
          REDIS_URL: redis://localhost:6379/0
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: eu-west-2
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          COGNITO_USER_POOL_ID: local_user_pool
          COGNITO_CLIENT_ID: local_client_id
          COGNITO_REGION: eu-west-2
          ENVIRONMENT: test
        run: |
          pytest tests/integration -v --tb=short -m integration \
            --junitxml=reports/integration-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: reports/integration-results.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # PR Status Summary
  # ─────────────────────────────────────────────────────────────────────────────
  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [lint, unit-test, property-test, security-scan, build, integration-test]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Check pipeline status
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-test.result }}" == "failure" ]] || \
             [[ "${{ needs.property-test.result }}" == "failure" ]] || \
             [[ "${{ needs.security-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-test.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed. One or more stages did not pass."
            exit 1
          else
            echo "✅ All pipeline stages passed."
          fi
